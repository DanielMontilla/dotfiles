- defaults:
    link:
      relink: true
      create: true
      glob: true
      relative: true

# No `clean:` on a work Mac: ~/.config may already hold managed/user state.
- link:
    # Not ~/.ssh/config: a work Mac may already have a corporate SSH config.
    # Link into config.d and add one `Include config.d/*` line (README §9).
    ~/.ssh/config.d/pikpik.conf:
      path: profiles/pikpik/ssh/config

    # Only config.fish: fish_variables is per-machine state that fish rewrites,
    # so linking it would dirty the repo and carry Linux paths onto macOS.
    ~/.config/fish/config.fish: profiles/shared/fish/config.fish

    # macOS's login shell stays zsh (nix-darwin cannot change an account it
    # did not create), so this file hands interactive zsh to fish.
    ~/.zshrc: profiles/pikpik/zshrc

    ~/.config/nvim/:
      path: profiles/shared/neovim/*

    ~/.config/herdr/config.toml:
      path: profiles/shared/herdr/config.toml
      force: true

    ~/.config/zed/:
      path: profiles/shared/zed/*

    ~/.config/starship.toml: profiles/shared/starship/starship.toml

    # Karabiner-Elements reads its main config from this path. Keep the JSON in
    # the profile so the modifier remap is versioned and reproducible.
    ~/.config/karabiner/karabiner.json: profiles/pikpik/karabiner/karabiner.json

    # Ghostty on macOS reads Application Support, not ~/.config/ghostty, so the
    # shared Linux config (GTK-only options, Nerd Font pikpik does not install)
    # is not used here.
    "~/Library/Application Support/com.mitchellh.ghostty/config": profiles/pikpik/ghostty/config

# Deliberately not linked on a work machine:
#   ~/.gitconfig  — the shared one uses a personal identity. Create
#                   profiles/pikpik/gitconfig with your work name/email and
#                   link that instead.
#   Herdr plugins — profiles/shared/herdr/plugins/ includes Linux/Windows
#                   notification plugins; only config.toml is linked above.
