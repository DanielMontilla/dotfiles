- defaults:
    link:
      relink: true
      create: true
      glob: true
      relative: true

# No `clean:` on a work Mac: ~/.config may already hold managed/user state.
- link:
    # Not ~/.ssh/config: a work Mac may already have a corporate SSH config.
    # Link into config.d and add one `Include config.d/*` line (README §5).
    ~/.ssh/config.d/pikpik.conf:
      path: profiles/pikpik/ssh/config

    # Only config.fish: fish_variables is per-machine state that fish rewrites,
    # so linking it would dirty the repo and carry Linux paths onto macOS.
    ~/.config/fish/config.fish: profiles/shared/fish/config.fish

    ~/.config/nvim/:
      path: profiles/shared/neovim/*

    ~/.config/starship.toml: profiles/shared/starship/starship.toml

# Deliberately not linked on a work machine:
#   ~/.gitconfig  — the shared one uses a personal identity. Create
#                   profiles/pikpik/gitconfig with your work name/email and
#                   link that instead.
#   ~/.config/zed — profiles/shared/zed/settings.json hardcodes a NixOS fish
#                   path; a macOS Zed config needs its own copy.
