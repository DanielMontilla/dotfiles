# vz: project-specific port forwards for pikpik.
# Loads only when connecting via `ssh pikpik-vz`.
# Forwards expose pikpik's local services on oatchi's localhost.

Host pikpik-vz
  HostName pikpik.tail5c357b.ts.net
  User danielmontilla
  Port 22
  IdentityFile ~/.ssh/id_ed25519
  StrictHostKeyChecking accept-new

  # Forward the local dev/backend ports so they're reachable on oatchi.
  LocalForward 1338 localhost:1338   # authentication service
  LocalForward 1339 localhost:1339   # mobile status / backend
  LocalForward 5173 localhost:5173   # admin dashboard (vite)
  LocalForward 8081 localhost:8081   # expo metro bundler